<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KioscoManager - Sistema Multitenant</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--r:3px;--rl:4px}
body{font-family:'Segoe UI',Impact,Arial Black,system-ui,sans-serif;background:#101010;transition:all .2s;letter-spacing:0}
.light-theme,.dark-theme{--bg:#101010;--surface:#1d1d1d;--surface2:#2a2a2a;--border:#3b3520;--text:#fff8e7;--muted:#c8bfa8;--accent:#ffd400;--accent2:#f5e9c7;--accent3:#ffd400;--danger:#ff5a52;--success:#ffd400;--sidebar:#0b0b0b;--sidebar-text:#fff8e7}
body{background:var(--bg);color:var(--text)}
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:var(--sidebar);color:var(--sidebar-text);display:flex;flex-direction:column;transition:.2s;border-right:1px solid #302b1b}
.sidebar-header{padding:18px 18px;border-bottom:1px solid #302b1b;text-transform:uppercase}
.sidebar-header h2{font-size:20px;font-weight:900;text-shadow:2px 2px 0 #000}
.nav-item{padding:13px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s;margin:3px 8px;border-radius:0;text-transform:uppercase;font-size:12px;font-weight:900;color:#e9dfc4;border-left:3px solid transparent}
.nav-item:hover{background:#242424;border-left-color:var(--accent)}
.nav-item.active{background:#ffd400;color:#1a1a1a;border-left-color:#fff}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#1b1b1b;padding:12px 24px;border-bottom:1px solid #302b1b;display:flex;justify-content:space-between;align-items:center;min-height:58px}
.topbar h3{text-transform:uppercase;font-size:24px;font-weight:900;text-shadow:2px 2px 0 #000}
.content{padding:24px;overflow-y:auto;flex:1;background:#101010}
.card{background:var(--surface);border-radius:0;padding:18px;margin-bottom:16px;border:1px solid var(--border);box-shadow:0 0 0 1px rgba(255,212,0,.03)}
.card-title{font-weight:900;margin-bottom:14px;font-size:15px;text-transform:uppercase;color:#fff8e7}
.metric{background:var(--surface2);border-radius:0;padding:18px;border:1px solid var(--border);border-left:4px solid var(--accent)}
.metric-label{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:900}
.metric-val{font-size:32px;font-weight:900;color:var(--accent);text-shadow:2px 2px 0 #000}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.btn{padding:10px 16px;border-radius:0;border:1px solid var(--border);background:#242424;cursor:pointer;font-size:12px;transition:.1s;color:var(--text);text-transform:uppercase;font-weight:900}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#151515}
.btn-success{background:var(--success);border-color:var(--success);color:#151515}
.btn-danger{background:var(--danger);border-color:var(--danger);color:white}
.btn-warning{background:var(--accent3);border-color:var(--accent3);color:#151515}
.btn-sm{padding:4px 10px;font-size:12px}
.inp{width:100%;padding:12px 14px;border:1px solid #2f2f2f;border-radius:0;background:#2a2a2a;color:var(--text);font-weight:700}
.inp:focus{outline:none;border-color:var(--accent)}
.lbl{font-size:11px;font-weight:600;margin-bottom:4px;display:block;color:var(--muted)}
.pos-container{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.prod-card{background:#151515;border:1px solid #343434;border-radius:0;padding:14px;cursor:pointer;text-align:left;transition:.1s;min-height:120px;display:flex;flex-direction:column;justify-content:space-between}
.prod-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.prod-card .name{font-weight:900;font-size:15px;text-transform:uppercase;color:#fff8e7}
.prod-card .price{color:var(--accent);font-weight:900;margin-top:10px;font-size:20px;text-shadow:1px 1px 0 #000}
.prod-card .stock{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}
.ticket-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.qty-btn{width:30px;height:30px;border-radius:0;border:1px solid var(--border);background:#111;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:900}
.calculadora{background:#111;border-radius:0;padding:12px;margin:10px 0;border:1px solid #302b1b}
.calc-display{font-size:32px;font-weight:900;text-align:right;padding:10px;background:#070707;border-radius:0;margin-bottom:10px;font-family:monospace;color:var(--accent)}
.calc-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc-btn{padding:13px;border-radius:0;border:1px solid var(--border);background:#242424;cursor:pointer;font-size:16px;text-align:center;color:var(--text);font-weight:900}
.calc-btn.enter{background:var(--success);color:#151515;border-color:var(--success)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--surface);border-radius:0;padding:24px;width:500px;max-width:90vw;max-height:85vh;overflow:auto;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:11px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-success{background:#dcfce7;color:#166534}
.badge-warning{background:#fef3c7;color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}
.badge-info{background:#dbeafe;color:#1e40af}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:var(--r);color:white;font-size:14px;z-index:9999;animation:slideIn .3s ease}
.toast-success{background:#22c55e}
.toast-error{background:#ef4444}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@media print{body *{visibility:hidden}#print-area,#print-area *{visibility:visible}#print-area{position:fixed;top:0;left:0;width:80mm;background:white;color:black;padding:8px;font-family:'Courier New',monospace}}
@media (max-width: 768px) {
  .app { flex-direction: column; }
  .sidebar { 
    width: 100%;
    order: 2;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 900;
    height: 76px;
    flex-direction: row;
    padding: 0;
    border-right: 0;
    border-top: 1px solid #403617;
    overflow-x: auto;
  }
  .sidebar-header { 
    display:none;
  }
  .sidebar > div:nth-child(2) { 
    display: flex; 
    flex-wrap: nowrap;
    gap: 0;
    width: max-content;
    padding: 0;
  }
  .nav-item { 
    padding: 10px 9px;
    font-size: 10px;
    margin: 0;
    min-width: 76px;
    height: 74px;
    justify-content:center;
    flex-direction:column;
    gap:5px;
    border-left:0;
    border-top:3px solid transparent;
  }
  .nav-item.active{border-top-color:#fff;background:#111;color:var(--accent)}
  .nav-item span{display:block!important;font-size:18px}
  .sidebar > div:last-child {
  display:none;
}
#user-name {
  font-size: 10px !important;
  max-width: 80px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
  .pos-container { 
    grid-template-columns: 1fr; 
  }
  .product-grid { 
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap:12px;
  }
  .grid-2, .grid-3, .grid-4 { 
    grid-template-columns: 1fr 1fr; 
  }
  .grid-4 { 
    grid-template-columns: repeat(2, 1fr); 
  }
  .main{padding-bottom:76px}
  .content { padding: 18px 14px; }
  .topbar { padding: 10px 14px; position:sticky; top:0; z-index:800; }
  .topbar h3{font-size:22px}
  #topbar-actions{width:100%;margin-top:8px}
  .topbar{align-items:flex-start;flex-direction:column}
  #topbar-actions>div{width:100%!important}
  #buscar-pos{width:100%!important}
  .prod-card{min-height:150px;padding:14px}
  .prod-card .name{font-size:14px}
  .prod-card .price{font-size:22px}
  .pos-container>.card{position:sticky;bottom:76px;z-index:700;border-color:#5a4b12;box-shadow:0 -12px 30px rgba(0,0,0,.45)}
  table { font-size: 11px; }
  th, td { padding: 6px 4px; }
  .modal { padding: 16px; }
  .calc-buttons { gap: 4px; }
  .calc-btn { padding: 10px; font-size: 14px; }
}

@media (max-width: 480px) {
  .grid-2, .grid-3, .grid-4 { 
    grid-template-columns: 1fr; 
  }
  .nav-item span { display: none; }
}
</style>
</head>
<body class="dark-theme" id="app-body">

<div id="print-area" style="display:none"></div>
<div id="toast-container"></div>

<!-- Login -->
<div id="login-screen" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#101010">
  <div style="background:#1d1d1d;border:1px solid #3b3520;padding:32px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,.45)">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:48px">🏪</div>
      <h1 style="text-transform:uppercase;text-shadow:2px 2px 0 #000">KioscoManager</h1>
      <p style="color:#ffd400;text-transform:uppercase;font-weight:900;font-size:12px">Sistema multi-local</p>
    </div>
    <div>
      <div class="lbl">Usuario / Email</div>
      <input class="inp" id="login-email" type="text" placeholder="ej: dueno@kiosco.com" style="margin-bottom:12px">
      <div class="lbl">PIN</div>
      <input class="inp" id="login-pin" type="password" placeholder="PIN de acceso" style="margin-bottom:16px" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn btn-primary" style="width:100%" onclick="doLogin()" id="btn-login">Ingresar</button>
      <div id="login-error" style="color:#ef4444;text-align:center;margin-top:12px;font-size:13px"></div>
    </div>
  </div>
</div>

<!-- App principal -->
<div id="app-screen" style="display:none">
  <div class="app">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>🏪 Kiosco<span style="color:#fbbf24">Manager</span></h2>
        <div style="font-size:12px;margin-top:8px" id="local-name-badge"></div>
      </div>
      <div style="flex:1;padding:12px 0">
        <div class="nav-item active" data-page="pos" onclick="navigate('pos')"><span>💰</span> POS / Venta</div>
        <div class="nav-item" id="nav-turnos" data-page="turnos" onclick="navigate('turnos')" style="display:none"><span>🔄</span> Turnos / Caja</div>
        <div class="nav-item" data-page="ventas" onclick="navigate('ventas')"><span>📋</span> Historial</div>
        <div class="nav-item" data-page="reportes" onclick="navigate('reportes')"><span>📊</span> Reportes</div>
        <div class="nav-item" data-page="productos" onclick="navigate('productos')"><span>📦</span> Productos</div>
        <div class="nav-item" data-page="stock" onclick="navigate('stock')"><span>📊</span> Stock</div>
        <div class="nav-item" data-page="proveedores" onclick="navigate('proveedores')"><span>🚚</span> Proveedores</div>
        <div class="nav-item" data-page="compras" onclick="navigate('compras')"><span>🛒</span> Compras</div>
        <div class="nav-item" data-page="clientes" onclick="navigate('clientes')"><span>👤</span> Clientes</div>
        <div class="nav-item" data-page="usuarios" onclick="navigate('usuarios')"><span>👥</span> Usuarios</div>
        <div class="nav-item" data-page="config" onclick="navigate('config')"><span>⚙️</span> Configuración</div>
        <div id="superadmin-panel" style="display:none">
          <div style="height:1px;background:rgba(255,255,255,.1);margin:12px 16px"></div>
          <div class="nav-item" data-page="locales" onclick="navigate('locales')"><span>🏢</span> Todos los Locales</div>
          <div class="nav-item" data-page="soporte" onclick="navigate('soporte')"><span>🛠️</span> Soporte</div>
        </div>
      </div>
      <div style="padding:16px;border-top:1px solid rgba(255,255,255,.1)">
  <div style="display:flex;justify-content:space-between;margin-bottom:12px">
    <span style="font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="user-name">Usuario</span>
    <button class="btn btn-sm" onclick="toggleTheme()">🌓</button>
  </div>
  <div id="turno-info" style="font-size:11px;color:#94a3b8;margin-bottom:8px"></div>
  <button class="btn btn-sm btn-warning" id="btn-cerrar-turno" style="width:100%;margin-bottom:6px;display:none" onclick="cerrarTurno()">🔒 Cerrar turno</button>
  <button class="btn btn-sm" style="width:100%" onclick="logout()">🚪 Salir</button>
</div>
    </div>
    <div class="main">
      <div class="topbar">
        <h3 id="page-title">POS / Caja</h3>
        <div id="topbar-actions"></div>
      </div>
      <div class="content" id="main-content"></div>
    </div>
  </div>
</div>

<div id="modal-root"></div>

<script>
// ==================== API CONFIG ====================
const API = '';
let currentUser = null;
let currentLocal = null;
let currentTicket = [];
let selectedPayment = 'efectivo';
let selectedCuotas = 1;
let descuentoActivo = false;
let descuentoValor = 0;
let productosCache = [];
let turnoActual = null;
let clientesCache = [];
let proveedoresCache = [];
let itemsCompra = [];
let productosImportacionPendiente = [];

const UNIDADES_MEDIDA = ['unidad', 'kg', 'g', 'l', 'ml'];

function unidadProducto(producto) {
  return producto?.unidad_medida || 'unidad';
}

function nombreUnidad(unidad, cantidad = 1) {
  if (unidad === 'unidad') return Math.abs(Number(cantidad)) === 1 ? 'u' : 'u';
  return unidad;
}

function formatearCantidad(cantidad, unidad = 'unidad') {
  const numero = Number(cantidad || 0);
  const decimales = unidad === 'unidad' ? 0 : 3;
  const texto = numero.toLocaleString('es-AR', {
    minimumFractionDigits: 0,
    maximumFractionDigits: decimales
  });
  return `${texto} ${nombreUnidad(unidad, numero)}`;
}

function pasoCantidad(unidad = 'unidad') {
  if (unidad === 'unidad') return 1;
  if (unidad === 'g' || unidad === 'ml') return 50;
  return 0.1;
}

function normalizarNumero(valor) {
  return Number(String(valor || '0').replace(/\./g, '').replace(',', '.'));
}

function pedirCantidadProducto(producto) {
  const unidad = unidadProducto(producto);
  if (unidad === 'unidad') return 1;
  const sugerido = unidad === 'g' || unidad === 'ml' ? '100' : '0,25';
  const respuesta = prompt(`Cantidad para ${producto.nombre} (${unidad})`, sugerido);
  if (respuesta === null) return null;
  const cantidad = normalizarNumero(respuesta);
  if (!Number.isFinite(cantidad) || cantidad <= 0) return null;
  return cantidad;
}


function getToken() { return localStorage.getItem('km_token'); }
function getHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() };
}

// ==================== TOAST (reemplaza alert) ====================
function toast(msg, tipo = 'success') {
  const t = document.createElement('div');
  t.className = `toast toast-${tipo}`;
  t.innerText = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function confirmarAccion(msg) {
  return new Promise(resolve => {
    document.getElementById('modal-root').innerHTML = `
      <div class="modal-overlay">
        <div class="modal" style="max-width:360px;text-align:center">
          <p style="margin-bottom:20px;font-size:15px">${msg}</p>
          <div style="display:flex;gap:8px;justify-content:center">
            <button class="btn" onclick="document.getElementById('modal-root').innerHTML='';resolveConfirm(false)">Cancelar</button>
            <button class="btn btn-primary" onclick="document.getElementById('modal-root').innerHTML='';resolveConfirm(true)">Confirmar</button>
          </div>
        </div>
      </div>`;
    window.resolveConfirm = resolve;
  });
}

// ==================== LOGIN ====================
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pin = document.getElementById('login-pin').value;
  const btnLogin = document.getElementById('btn-login');
  const errorDiv = document.getElementById('login-error');

  if (!email || !pin) { errorDiv.innerText = 'Completá email y PIN'; return; }

  btnLogin.innerText = 'Ingresando...';
  btnLogin.disabled = true;
  errorDiv.innerText = '';

  try {
    const res = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, pin })
    });

    const data = await res.json();

    if (!res.ok) {
      errorDiv.innerText = data.error || 'Credenciales incorrectas';
      btnLogin.innerText = 'Ingresar';
      btnLogin.disabled = false;
      return;
    }

    localStorage.setItem('km_token', data.token);
    currentUser = data.usuario;
    currentLocal = data.usuario.local_id ? { 
      id: data.usuario.local_id, 
      nombre: data.usuario.local_nombre,
      config: { intereses: { 1: 0, 3: 5, 6: 10 }, descuentos: { activado: false, tipo: 'porcentaje', valor: 0 }, mensajeTicket: '¡Gracias por su compra!' }
    } : null;

    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'flex';
    document.getElementById('user-name').innerHTML = `${currentUser.rol === 'superadmin' ? '👑' : currentUser.rol === 'admin_local' ? '👔' : '🧾'} ${currentUser.nombre}`;
    document.getElementById('local-name-badge').innerHTML = currentUser.local_nombre ? `🏪 ${currentUser.local_nombre}` : '🌐 SuperAdmin';

    if (currentUser.rol === 'superadmin') {
  document.getElementById('superadmin-panel').style.display = 'block';
  beep('login');
  navigate('locales');
  document.getElementById('btn-cerrar-turno').style.display = 'none';
  document.getElementById('nav-turnos').style.display = 'block';
} else {
  document.getElementById('superadmin-panel').style.display = 'none';
  await cargarProductos();
  await cargarConfig();
  beep('login');
  navigate('pos');
  if (currentUser.rol === 'cajero') {
    await verificarTurno();
    document.getElementById('btn-cerrar-turno').style.display = 'block';
    document.getElementById('nav-turnos').style.display = 'none';
  } else {
    document.getElementById('btn-cerrar-turno').style.display = 'none';
    document.getElementById('nav-turnos').style.display = 'block';
  }
}

  } catch (err) {
    errorDiv.innerText = 'Error de conexión con el servidor';
    btnLogin.innerText = 'Ingresar';
    btnLogin.disabled = false;
  }
}

function logout() {
  beep('salir');
  localStorage.removeItem('km_token');
  currentUser = null;
  currentLocal = null;
  currentTicket = [];
  productosCache = [];
  descuentoActivo = false;
  descuentoValor = 0;
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-email').value = '';
  document.getElementById('login-pin').value = '';
}

function hasPermission(action) {
  if (!currentUser) return false;
  if (currentUser.rol === 'superadmin') return true;
  if (currentUser.rol === 'admin_local') return true;
  const permisosCajero = ['pos', 'ventas', 'clientes'];
  return permisosCajero.includes(action);
}

function navigate(page) {
  if (!hasPermission(page) && page !== 'locales' && page !== 'soporte') {
    toast('No tenés permiso para acceder a esta sección', 'error'); return;
  }
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const activeEl = document.querySelector(`[data-page="${page}"]`);
  if (activeEl) activeEl.classList.add('active');
  const titles = { pos:'💰 POS / Caja', ventas:'📋 Historial de ventas', productos:'📦 Productos', stock:'📊 Control de Stock', proveedores:'🚚 Proveedores', usuarios:'👥 Usuarios', config:'⚙️ Configuración', locales:'🏢 Todos los Locales', soporte:'🛠️ Soporte Técnico' };
  document.getElementById('page-title').innerText = titles[page] || page;
  document.getElementById('topbar-actions').innerHTML = '';
  if (page === 'pos') renderPOS();
  else if (page === 'ventas') renderVentas();
  else if (page === 'productos') renderProductos();
  else if (page === 'stock') renderStock();
  else if (page === 'proveedores') renderProveedores();
  else if (page === 'usuarios') renderUsuarios();
  else if (page === 'config') renderConfig();
  else if (page === 'locales') renderLocales();
  else if (page === 'soporte') renderSoporte();
  else if (page === 'turnos') renderHistorialTurnos();
  else if (page === 'reportes') renderReportes();
  else if (page === 'clientes') renderClientes();
  else if (page === 'compras') renderCompras();
}

// ==================== API CALLS ====================
async function cargarProductos() {
  try {
    const res = await fetch(`${API}/api/productos`, { headers: getHeaders() });
    productosCache = await res.json();
    if (currentLocal) currentLocal.productos = productosCache;
  } catch(e) { toast('Error cargando productos', 'error'); }
}

async function cargarVentas() {
  try {
    const res = await fetch(`${API}/api/ventas`, { headers: getHeaders() });
    return await res.json();
  } catch(e) { toast('Error cargando ventas', 'error'); return []; }
}

// ==================== DESCUENTOS ====================
function calcularDescuento(subtotal) {
  if (!descuentoActivo) return 0;
  const cfg = currentLocal?.config?.descuentos;
  if (!cfg || !cfg.activado) return 0;
  return cfg.tipo === 'porcentaje' ? subtotal * (cfg.valor / 100) : Math.min(cfg.valor, subtotal);
}

function getTotalConDescuento() {
  const subtotal = currentTicket.reduce((s, i) => s + i.precio * i.cantidad, 0);
  return subtotal - calcularDescuento(subtotal);
}

function aplicarDescuentoManual() {
  const subtotal = currentTicket.reduce((s, i) => s + i.precio * i.cantidad, 0);
  if (subtotal === 0) { toast('Agregá productos primero', 'error'); return; }
  const cfg = currentLocal?.config?.descuentos;
  if (!cfg || !cfg.activado) { toast('Los descuentos no están activados', 'error'); return; }
  const valor = parseFloat(prompt(`Aplicar descuento (${cfg.tipo === 'porcentaje' ? '%' : '$'}):`));
  if (isNaN(valor) || valor < 0) return;
  descuentoValor = valor;
  descuentoActivo = valor > 0;
  renderTicket();
}

function toggleDescuento() {
  if (!descuentoActivo) aplicarDescuentoManual();
  else { descuentoActivo = false; descuentoValor = 0; renderTicket(); }
}

let calcValue = '0';
function calcAdd(num) { calcValue = calcValue === '0' ? num : calcValue + num; document.getElementById('calc-display').innerText = calcValue; }
function calcClear() { calcValue = '0'; document.getElementById('calc-display').innerText = '0'; document.getElementById('vuelto-display').style.display = 'none'; }
function calcBack() { calcValue = calcValue.slice(0,-1) || '0'; document.getElementById('calc-display').innerText = calcValue; }
function calcularVuelto() {
  const total = getTotalConDescuento();
  const pago = parseInt(calcValue.replace(/\./g, ''));
  if (isNaN(pago) || pago < total) { toast(`Monto insuficiente. Total: $${total.toLocaleString('es-AR')}`, 'error'); return; }
  const vuelto = pago - total;
  document.getElementById('vuelto-display').innerHTML = `💰 Vuelto: $${vuelto.toLocaleString('es-AR')}`;
  document.getElementById('vuelto-display').style.display = 'block';
}

function setPayment(method) { selectedPayment = method; renderPOS(); }
function setCuotas(cuotas) { selectedCuotas = parseInt(cuotas); }

function activarScannerPOS() {
  const input = document.getElementById('buscar-pos');
  if (!input) return;
  input.value = '';
  input.focus();
  toast('Listo para escanear codigo', 'success');
}

function buscarPorCodigoPOS(codigo) {
  const valor = String(codigo || '').trim();
  if (!valor) return;
  const producto = productosCache.find(p => String(p.cod_barras || '') === valor);
  if (!producto) {
    beep('error');
    toast('Producto no encontrado', 'error');
    return;
  }
  beep('scanner');
  addToTicket(producto.id);
  const input = document.getElementById('buscar-pos');
  if (input) input.value = '';
  renderProductGrid(productosCache);
}

function filterProducts(q) {
  if (!q) { renderProductGrid(productosCache); return; }
  const prods = productosCache.filter(p => 
    p.nombre.toLowerCase().includes(q.toLowerCase()) ||
    (p.cod_barras && p.cod_barras.includes(q))
  );
  if (prods.length === 1 && q.length > 5) {
    buscarPorCodigoPOS(q);
    return;
  }
  renderProductGrid(prods);
}

function renderProductGrid(prods) {
  const grid = document.getElementById('product-grid-pos');
  if (!grid) return;
  if (prods.length === 0) { grid.innerHTML = '<div style="color:var(--muted);grid-column:1/-1;text-align:center;padding:20px">No hay productos</div>'; return; }
  grid.innerHTML = prods.map(p => `
    <div class="prod-card" onclick='addToTicket(${JSON.stringify(p.id)})'>
      <div class="name">${p.nombre}</div>
      <div class="price">$${parseFloat(p.precio).toLocaleString('es-AR')} / ${nombreUnidad(unidadProducto(p))}</div>
      <div class="stock">Stock: ${formatearCantidad(p.stock, unidadProducto(p))}</div>
    </div>`).join('');
}

function addToTicket(id) {
  const prod = productosCache.find(p => p.id === id);
  if (!prod) return;
  if (Number(prod.stock) <= 0) {
    beep('error');
    toast('Sin stock disponible', 'error'); return; }
  const cantidadInicial = pedirCantidadProducto(prod);
  if (!cantidadInicial) return;
  if (cantidadInicial > Number(prod.stock)) {
    beep('error');
    toast('Stock insuficiente', 'error');
    return;
  }
  const existing = currentTicket.find(i => i.id === id);
  if (existing) existing.cantidad += cantidadInicial;
  else currentTicket.push({ ...prod, precio: parseFloat(prod.precio), cantidad: cantidadInicial });
  renderTicket();
}

function renderTicket() {
  const container = document.getElementById('ticket-items');
  if (!container) return;
  const subtotal = currentTicket.reduce((s, i) => s + i.precio * i.cantidad, 0);
  const descuento = calcularDescuento(subtotal);
  const total = subtotal - descuento;
  const resumenDiv = document.getElementById('resumen-total');
  if (resumenDiv) {
    resumenDiv.innerHTML = `
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted)"><span>Subtotal:</span><span>$${subtotal.toLocaleString('es-AR')}</span></div>
      ${descuento > 0 ? `<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--accent3)"><span>🎯 Descuento:</span><span>-$${descuento.toLocaleString('es-AR')}</span></div>` : ''}
      <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)"><span>TOTAL:</span><span>$${total.toLocaleString('es-AR')}</span></div>`;
  }
  if (currentTicket.length === 0) { container.innerHTML = '<div style="color:var(--muted);text-align:center;padding:20px">Agregá productos al ticket</div>'; return; }
  container.innerHTML = currentTicket.map((item, idx) => `
    <div class="ticket-item">
      <span style="flex:1">${item.nombre}</span>
      <button class="qty-btn" onclick="changeQty(${idx},-${pasoCantidad(unidadProducto(item))})">-</button>
      <span style="min-width:58px;text-align:center">${formatearCantidad(item.cantidad, unidadProducto(item))}</span>
      <button class="qty-btn" onclick="changeQty(${idx},${pasoCantidad(unidadProducto(item))})">+</button>
      <span style="min-width:70px;text-align:right">$${(item.precio*item.cantidad).toLocaleString('es-AR')}</span>
    </div>`).join('');
}

function changeQty(idx, delta) {
  const item = currentTicket[idx];
  const nuevaCantidad = Number((item.cantidad + delta).toFixed(3));
  if (nuevaCantidad > Number(item.stock)) {
    toast('Stock insuficiente', 'error');
    return;
  }
  currentTicket[idx].cantidad = nuevaCantidad;
  if (currentTicket[idx].cantidad <= 0) currentTicket.splice(idx, 1);
  renderTicket();
}

async function limpiarTicket() {
  const ok = await confirmarAccion('¿Limpiar todo el ticket?');
  if (!ok) return;
  currentTicket = []; descuentoActivo = false; descuentoValor = 0;
  renderTicket(); calcClear(); renderPOS();
}

async function confirmarPago() {
  if (currentTicket.length === 0) { 
    beep('error');
    toast('Agregá productos al ticket', 'error'); return; }
  let subtotal = currentTicket.reduce((s, i) => s + i.precio * i.cantidad, 0);
  let descuento = calcularDescuento(subtotal);
  let total = subtotal - descuento;
  let metodo = selectedPayment;

  if (selectedPayment === 'credito') {
    const interes = currentLocal?.config?.intereses?.[selectedCuotas] || 0;
    total = total * (1 + interes / 100);
    metodo = `credito_${selectedCuotas}cuotas`;
  }

  if (selectedPayment === 'efectivo') {
  const pagoStr = calcValue.replace(/\./g, '');
  const pago = parseInt(pagoStr);
  if (calcValue !== '0' && !isNaN(pago) && pago < total) { 
    toast(`Monto insuficiente. Total: $${Math.round(total).toLocaleString('es-AR')}`, 'error'); 
    return; 
  }
}

  try {
    const res = await fetch(`${API}/api/ventas`, {
      method: 'POST',
      headers: getHeaders(),
      body: JSON.stringify({
        items: currentTicket.map(i => ({ id: i.id, nombre: i.nombre, precio: i.precio, cantidad: i.cantidad })),
        subtotal, descuento, total: Math.round(total), metodo_pago: metodo, cuotas: selectedCuotas
      })
    });

    const data = await res.json();
    if (!res.ok) { toast(data.error || 'Error al registrar venta', 'error'); return; }

    // Actualizar stock local
    for (let item of currentTicket) {
      const prod = productosCache.find(p => p.id === item.id);
      if (prod) prod.stock = Number((Number(prod.stock) - item.cantidad).toFixed(3));
    }

    if (selectedPayment === 'efectivo') {
      const pago = parseInt(calcValue);
      const vuelto = pago - Math.round(total);
      if (vuelto > 0) toast(`💵 Vuelto: $${vuelto.toLocaleString('es-AR')}`, 'success');
    }
    beep('cobrar');
    toast('✅ Venta registrada correctamente', 'success');
    console.log('Venta para ticket:', data.venta);
    imprimirTicket({ ...data.venta, items: currentTicket.map(i => ({ nombre: i.nombre, cantidad: i.cantidad, precio: i.precio, unidad_medida: unidadProducto(i) })) });

    currentTicket = []; descuentoActivo = false; descuentoValor = 0; calcValue = '0';
    renderPOS();

  } catch(err) {
    console.error('Error cobrando:', err);
    beep('error');
    toast('Error de conexión', 'error');
  }
}

function parseCSVProductos(texto) {
  const primeraLinea = texto.split(/\r?\n/)[0] || '';
  const separador = (primeraLinea.match(/;/g) || []).length > (primeraLinea.match(/,/g) || []).length ? ';' : ',';
  const filas = [];
  let fila = [];
  let valor = '';
  let comillas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    const siguiente = texto[i + 1];
    if (c === '"' && comillas && siguiente === '"') {
      valor += '"';
      i++;
    } else if (c === '"') {
      comillas = !comillas;
    } else if (c === separador && !comillas) {
      fila.push(valor.trim());
      valor = '';
    } else if ((c === '\n' || c === '\r') && !comillas) {
      if (c === '\r' && siguiente === '\n') i++;
      fila.push(valor.trim());
      if (fila.some(v => v !== '')) filas.push(fila);
      fila = [];
      valor = '';
    } else {
      valor += c;
    }
  }
  fila.push(valor.trim());
  if (fila.some(v => v !== '')) filas.push(fila);
  if (filas.length < 2) return [];
  const headers = filas[0].map(h => h.trim().toLowerCase());
  return filas.slice(1).map(cols => {
    const item = {};
    headers.forEach((h, idx) => { item[h] = cols[idx] || ''; });
    return item;
  });
}

function normalizarProductoImportado(p) {
  return {
    nombre: p.nombre || '',
    categoria: p.categoria || 'General',
    precio: normalizarNumero(p.precio),

    stock: normalizarNumero(p.stock),
    stock_min: normalizarNumero(p.stock_min || 5),
    cod_barras: p.cod_barras || '',
    unidad_medida: UNIDADES_MEDIDA.includes(p.unidad_medida) ? p.unidad_medida : 'unidad'
  };
}

async function leerCSVProductos(event) {
  const file = event.target.files?.[0];
  event.target.value = '';
  if (!file) return;
  const texto = await file.text();
  const productos = parseCSVProductos(texto).map(normalizarProductoImportado);
  if (productos.length === 0) {
    toast('El CSV no tiene productos', 'error');
    return;
  }
  mostrarPreviewImportacion(productos);
}

  try {

document.addEventListener('keydown', function(e) {
  const posActivo = document.getElementById('product-grid-pos');
  const calcDisplay = document.getElementById('calc-display');
  if (!posActivo || !calcDisplay) return;
  
  // Si hay un modal abierto no hacer nada
  const modalRoot = document.getElementById('modal-root');
  if (modalRoot && modalRoot.innerHTML.trim() !== '') return;
  
  // Si el foco está en un input no hacer nada
  const tagActivo = document.activeElement.tagName;
  if (tagActivo === 'INPUT' || tagActivo === 'TEXTAREA' || tagActivo === 'SELECT') return;

  if (e.key >= '0' && e.key <= '9') {
    calcAdd(e.key);
  } else if (e.key === 'Backspace') {
    calcBack();
  } else if (e.key === 'Escape') {
    calcClear();
  } else if (e.key === 'Enter') {
    calcularVuelto();
  } else if (e.key === 'Delete') {
    calcClear();
  }
});

  if (!fecha) return '-';
  const texto = String(fecha);
  const match = texto.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (match) {
    const [, anio, mes, dia] = match;
    return new Date(Number(anio), Number(mes) - 1, Number(dia)).toLocaleDateString('es-AR', {
      day: 'numeric',
      month: 'short'
    });
  }
  const date = new Date(texto);
  if (isNaN(date.getTime())) return texto;
  return date.toLocaleDateString('es-AR', {
    day: 'numeric',
    month: 'short',
    timeZone: 'America/Argentina/Buenos_Aires'
  });
}

function agregarItemCompra() {
  const productoId = document.getElementById('compra-producto').value;
  const cantidad = normalizarNumero(document.getElementById('compra-cantidad').value);

  const prod = productosCache.find(p => String(p.id) === String(productoId));

  const existing = itemsCompra.find(i => String(i.producto_id) === String(productoId));
  if (existing) {
    existing.cantidad += cantidad;
  } else {
    itemsCompra.push({ producto_id: productoId, nombre_producto: prod.nombre, cantidad, precio_unitario: precio, unidad_medida: unidadProducto(prod) });
  }
  renderItemsCompra();
}

function renderItemsCompra() {
  const lista = document.getElementById('items-compra-lista');

  const total = itemsCompra.reduce((s,i) => s + i.precio_unitario * i.cantidad, 0);
  lista.innerHTML = `

const sonidos = {
  cobrar: new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAA...'),
};

function beep(tipo = 'cobrar') {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  
  if (tipo === 'cobrar') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523, ctx.currentTime);
    osc.frequency.setValueAtTime(659, ctx.currentTime + 0.12);
    osc.frequency.setValueAtTime(784, ctx.currentTime + 0.24);
    osc.frequency.setValueAtTime(1046, ctx.currentTime + 0.36);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.6);
   } else if (tipo === 'error') {
     osc.type = 'sawtooth';
     osc.frequency.setValueAtTime(300, ctx.currentTime);
     osc.frequency.setValueAtTime(200, ctx.currentTime + 0.15);
     osc.frequency.setValueAtTime(150, ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.4);
  } else if (tipo === 'login') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, ctx.currentTime);
    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
    osc.frequency.setValueAtTime(800, ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + 0.5);
  } else if (tipo === 'scanner') {
    osc.frequency.setValueAtTime(1200, ctx.currentTime);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.1);
    } else if (tipo === 'reset') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1000, ctx.currentTime);
    osc.frequency.setValueAtTime(800, ctx.currentTime + 0.1);
    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.2);
    osc.frequency.setValueAtTime(400, ctx.currentTime + 0.3);
    osc.frequency.setValueAtTime(200, ctx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.6);
   } else if (tipo === 'salir') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, ctx.currentTime);
    osc.frequency.setValueAtTime(600, ctx.currentTime + 0.15);
    osc.frequency.setValueAtTime(400, ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.5);
  }
}  // ← cierre de beep

async function guardarMPToken() {
  const token = document.getElementById('mp-token').value;
  if (!token) { toast('Ingresá el token', 'error'); return; }
  try {
    const res = await fetch(`${API}/api/locales/mp-token`, {
      method: 'PUT',
      headers: getHeaders(),
      body: JSON.stringify({ token })
    });
    if (!res.ok) { toast('Error al guardar token', 'error'); return; }
    toast('✅ MercadoPago configurado correctamente', 'success');
  } catch(e) { toast('Error de conexión', 'error'); }
}

async function cobrarConMP() {
  if (currentTicket.length === 0) { toast('Agregá productos al ticket', 'error'); return; }
  const subtotal = currentTicket.reduce((s, i) => s + i.precio * i.cantidad, 0);
  const descuento = calcularDescuento(subtotal);
  const total = subtotal - descuento;

  try {
    const res = await fetch(`${API}/api/pagos/qr`, {
      method: 'POST',
      headers: getHeaders(),
      body: JSON.stringify({
        items: currentTicket.map(i => ({ nombre: i.nombre, cantidad: i.cantidad, precio: i.precio })),
        total
      })
    });
    const data = await res.json();
    if (!res.ok) { toast(data.error || 'Error al generar QR', 'error'); return; }

    // Mostrar QR
    document.getElementById('modal-root').innerHTML = `
      <div class="modal-overlay">
        <div class="modal" style="text-align:center;max-width:400px">
          <h3 style="margin-bottom:8px">💳 Cobrar con MercadoPago</h3>
          <p style="color:var(--muted);margin-bottom:16px">Total: <strong>$${total.toLocaleString('es-AR')}</strong></p>
          <div style="margin-bottom:16px">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(data.init_point)}" 
                 style="width:200px;height:200px;border:1px solid var(--border);border-radius:8px">
          </div>
          <p style="font-size:13px;color:var(--muted);margin-bottom:16px">El cliente escanea el QR con la app de MercadoPago</p>
          <div style="display:flex;gap:8px;justify-content:center">
            <button class="btn" onclick="cerrarModal()">Cancelar</button>
            <button class="btn btn-success" onclick="confirmarPagoMP('${data.preference_id}')">✅ Confirmar pago</button>
          </div>
        </div>
      </div>`;
  } catch(e) { toast('Error de conexión', 'error'); }
}
